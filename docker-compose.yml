services:
  # Wyoming Piper TTS service
  piper:
    # Multi-architecture index digest resolved from Docker Hub on 2026-07-16.
    image: rhasspy/wyoming-piper@sha256:69b7f797ae3a8c3c0202cbf97152fb795d78c2355de2a31655c20671247360d8
    container_name: wakeword-piper
    restart: unless-stopped
    ports:
      - "10200:10200"
    volumes:
      - ./wakeword_lab/data/services/piper:/data
    command: >
      --voice en_US-lessac-high
      --data-dir /data
      --uri tcp://0.0.0.0:10200
    networks:
      - wakeword-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s = socket.socket(); s.connect(('127.0.0.1', 10200)); s.close()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Wyoming openWakeWord service
  openwakeword:
    # Multi-architecture index digest resolved from Docker Hub on 2026-07-16.
    image: rhasspy/wyoming-openwakeword@sha256:52cb1168731a1849fc28cf339c935fde58746bbabc94226668a40ef6ddf5d42b
    container_name: wakeword-openwakeword
    restart: unless-stopped
    ports:
      - "10400:10400"
    volumes:
      - ./wakeword_lab/data/services/openwakeword:/data
      - ./wakeword_lab/data/custom_models:/custom-models:ro
    command: >
      --uri tcp://0.0.0.0:10400
      --custom-model-dir /custom-models
      --preload-model alexa
    networks:
      - wakeword-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s = socket.socket(); s.connect(('127.0.0.1', 10400)); s.close()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Training environment
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wakeword-trainer
    stdin_open: true
    tty: true
    environment:
      - WYOMING_PIPER_HOST=piper
      - WYOMING_PIPER_PORT=10200
      - WYOMING_OPENWAKEWORD_HOST=openwakeword
      - WYOMING_OPENWAKEWORD_PORT=10400
      - BASE_DIR=/workspace/data
      - ALLOW_LOW_DISK=1
      - PYTHONUNBUFFERED=1
      - TRAIN_PROFILE=${TRAIN_PROFILE:-medium}
      - TRAIN_THREADS=${TRAIN_THREADS:-2}
      - MODEL_FORMAT=${MODEL_FORMAT:-tflite}
      - AVAAS_IMPORT_DIRS=${AVAAS_IMPORT_DIRS:-}
      - AVAAS_MIN_GENERIC_POSITIVES=${AVAAS_MIN_GENERIC_POSITIVES:-6}
      - AVAAS_MIN_PERSONALIZED_POSITIVES=${AVAAS_MIN_PERSONALIZED_POSITIVES:-8}
      - AVAAS_MAX_PERSONALIZED_POSITIVES=${AVAAS_MAX_PERSONALIZED_POSITIVES:-512}
      - AVAAS_MAX_TOTAL_POSITIVES=${AVAAS_MAX_TOTAL_POSITIVES:-20000}
    volumes:
      - ./:/app:ro
      - ./wakeword_lab/data:/workspace/data
    working_dir: /app
    networks:
      - wakeword-net
    depends_on:
      piper:
        condition: service_healthy
      openwakeword:
        condition: service_healthy

  # Web wizard
  web-wizard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wakeword-web-wizard
    ports:
      - "5000:5000"
    environment:
      - WYOMING_PIPER_HOST=piper
      - WYOMING_PIPER_PORT=10200
      - WYOMING_OPENWAKEWORD_HOST=openwakeword
      - WYOMING_OPENWAKEWORD_PORT=10400
      - BASE_DIR=/workspace/data
      - ALLOW_LOW_DISK=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/app:ro
      - ./wakeword_lab/data:/workspace/data
    working_dir: /app
    networks:
      - wakeword-net
    depends_on:
      piper:
        condition: service_healthy
      openwakeword:
        condition: service_healthy
    command: python wakeword_web.py
    profiles:
      - web  # Only start with --project-name or when explicitly enabled

networks:
  wakeword-net:
    driver: bridge
