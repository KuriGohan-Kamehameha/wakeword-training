name: AVAAS wakeword contract

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python3 -m py_compile avaas_import.py stage_personalized_positives.py generate_dataset.py
      - name: Validate shell syntax
        run: bash -n trainer.sh docker-train.sh
      - name: Run AVAAS import and staging contracts
        run: python3 -m unittest discover -s tests -v
      - name: Exercise bounded CLIs
        run: |
          python3 avaas_import.py --help >/dev/null
          python3 stage_personalized_positives.py --help >/dev/null
