name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: python -m py_compile *.py

      - name: Shell syntax check
        run: bash -n docker-train.sh trainer.sh

      - name: Ensure Docker Compose v2
        # ubuntu-latest ships Compose v2 preinstalled, and docker-compose-plugin is
        # not in the runner apt sources (apt-get exited 100). Install from the Ubuntu
        # archive only if Compose is genuinely missing.
        run: |
          if ! docker compose version; then
            sudo apt-get update
            sudo apt-get install -y docker-compose-v2
          fi
          docker compose version

      - name: Compose config validation
        run: docker compose config >/dev/null
